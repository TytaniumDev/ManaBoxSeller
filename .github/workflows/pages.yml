name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    # Daily, so new Card Kingdom sets and printings are picked up automatically.
    - cron: '0 9 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      # If Card Kingdom's price list can't be fetched, this fails and the
      # previous deployment (with yesterday's map) stays live.
      - run: npm run build:map -- _site/data/card-kingdom-map.json
      - name: Copy site files
        run: cp -r index.html styles.css js _site/
      - uses: actions/upload-pages-artifact@v3

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
